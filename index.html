<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="YuE2 project website. More details coming soon.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <title>YuE2</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #15171c;
        background: #fff;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      .page {
        max-width: 76rem;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0 auto;
        padding: clamp(1.5rem, 5vw, 4rem);
        display: flex;
        flex-direction: column;
      }
      header, footer { display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; }
      .wordmark { font-size: 1.25rem; font-weight: 750; letter-spacing: -.05em; }
      .label { color: #5c616c; font-size: .875rem; line-height: 1.5; }
      main { flex: 1; padding: clamp(4rem, 14vh, 10rem) 0; }
      .eyebrow { margin: 0 0 1.75rem; color: #244bdb; font-size: 1rem; font-weight: 600; }
      h1 { margin: 0; font-size: clamp(5rem, 18vw, 13rem); line-height: .95; letter-spacing: -.085em; font-weight: 750; }
      .description { margin: 2rem 0 2.5rem; font-size: clamp(1.125rem, 3vw, 1.5rem); line-height: 1.6; color: #5c616c; }
      a { color: #15171c; font-size: 1rem; line-height: 1.5; text-underline-offset: .3em; }
      a:hover { color: #244bdb; }
      a:focus-visible { outline: 3px solid #244bdb; outline-offset: 6px; border-radius: 2px; }
      footer { border-top: 1px solid #e3e5ea; padding-top: 1.5rem; }
      @media (max-width: 30rem) {
        header, footer { align-items: flex-start; flex-wrap: wrap; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <span class="wordmark">YuE2</span>
        <span class="label">Music generation research</span>
      </header>
      <main>
        <p class="eyebrow">Coming soon</p>
        <h1>YuE2</h1>
        <p class="description">Our project page is being prepared.</p>
        <a href="https://map-yue.github.io/">Explore YuE <span aria-hidden="true">↗</span></a>
      </main>
      <footer>
        <span class="label">YuE2 · Project website</span>
      </footer>
    </div>
  </body>
</html>
